<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TaskTrack</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body class="bg-light">

<div class="container py-4">

    <div class="text-center mb-4">

        <div class="logo-circle mb-3">
            ✔
        </div>

        <h2 class="fw-bold">
            TaskTrack
        </h2>

        <p class="text-muted">
            Daily Employee Checklist
        </p>

    </div>

    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body">

            <div class="mb-3">

                <label class="form-label">

                    Language

                </label>

                <select
                    id="language"
                    class="form-select">

                    <option value="en">
                        English
                    </option>

                    <option value="es">
                        Español
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Employee

                </label>

                <select
                    id="employeeSelect"
                    class="form-select">

                    <option>
                        Loading Employees...
                    </option>

                </select>

            </div>

            <div class="alert alert-warning">

                <strong>GPS</strong>

                <div id="gpsStatus">

                    Waiting...

                </div>

            </div>

            <button
                id="clockInBtn"
                class="btn btn-primary w-100 btn-lg">

                Clock In

            </button>

        </div>

    </div>

    <div
        id="taskScreen"
        class="mt-4"
        style="display:none;">

        <div class="card shadow-sm border-0 rounded-4">

            <div class="card-body">

                <h4
                    id="welcomeText">
                    Welcome
                </h4>

                <p>

                    Clocked In

                    <strong
                        id="clockInTime">

                    </strong>

                </p>

                <hr>

                <div id="taskList">

                </div>

                <button
                    id="submitBtn"
                    class="btn btn-success w-100 mt-3">

                    Submit Tasks

                </button>

            </div>

        </div>

    </div>

</div>

<script src="api.js"></script>
<script src="translate.js"></script>
<script src="app.js"></script>

</body>
</html>
